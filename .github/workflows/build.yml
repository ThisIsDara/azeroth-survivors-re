# A manual build of the browser client: the same chain as `make build`, handed back as
#
#   - a `web-dist` run artifact (raw web/dist), always
#   - prebuilt wenilla-host binaries (linux + windows), always
#   - a GitHub release (tag from the `tag` input) with: client tarball, host binaries, an
#     installer, and — when the `data` input is on — the WoW 1.12.1 client split into
#     <2 GiB chunks, the release-asset ceiling. Runners have the RAM and disk a small
#     local box lacks.
#
# The bundled data is Blizzard content, re-hosted at the repo owner's request; the project
# itself ships none and points at archive.org instead.
name: build

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Rendering backend
        type: choice
        options: [webgpu, webgl2]
        default: webgpu
      debug:
        description: Keep wasm symbols (WEB_DEBUG=1) for readable stack traces
        type: boolean
        default: false
      data:
        description: Download and bundle the WoW 1.12.1 client data (~5.5 GB, +15 min)
        type: boolean
        default: true
      tag:
        description: Release tag to publish (a re-run replaces it)
        type: string
        default: latest

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # No debuginfo: it is most of target/, and a runner's disk is small.
      CARGO_PROFILE_DEV_DEBUG: 0
      WEB_BACKEND: ${{ inputs.backend }}
      WEB_DEBUG: ${{ inputs.debug && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: brotli (precompressed siblings for the host)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq brotli
      - name: Toolchain
        run: rustup toolchain install && rustc -V
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-wasm
          # wasi-sdk and binaryen land in tools/, wasm-bindgen-cli in ~/.cargo/bin.
          cache-directories: tools
      - name: toolchain (scripts/web-setup.sh)
        run: scripts/web-setup.sh
      - name: build (scripts/web-build.sh)
        run: scripts/web-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 7

  host-bins:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: host-bins
      - name: mingw (the windows cross target)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64
      - name: linux binary
        run: cargo build --release -p wenilla-host --locked
      - name: windows binary
        run: cargo build --release -p wenilla-host --locked --target x86_64-pc-windows-gnu
      - name: pack
        run: |
          mkdir -pv out
          cp target/release/wenilla-host out/wenilla-host-linux-x86_64
          cp target/x86_64-pc-windows-gnu/release/wenilla-host.exe out/wenilla-host-windows-x86_64.exe
          for f in out/*; do gzip -9 "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: host-bins
          path: out/
          if-no-files-found: error
          retention-days: 7

  data:
    if: ${{ inputs.data }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      # The zip, the tar and the chunks coexist briefly: ~16 GB working set.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: fetch (scripts/fetch-data.sh)
        run: scripts/fetch-data.sh
      - name: tar + split into <2 GiB chunks (the release-asset ceiling)
        run: |
          mkdir -pv out
          tar -cf out/wow-data.tar -C wow-data Data
          (cd out && sha256sum wow-data.tar > sha256.txt)
          split -b 1900M -d out/wow-data.tar out/wow-data.tar.part-
          rm out/wow-data.tar
      - uses: actions/upload-artifact@v4
        with:
          name: data-parts
          path: out/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [wasm, host-bins, data]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: stage/web/dist
      - uses: actions/download-artifact@v4
        with:
          name: host-bins
          path: stage/bins
      - if: ${{ inputs.data }}
        uses: actions/download-artifact@v4
        with:
          name: data-parts
          path: stage/data
      - name: pack the release assets
        run: |
          mkdir -pv assets
          cp release/install.sh assets/install.sh
          sed -i "s|__ASSET_BASE__|https://github.com/${REPO}/releases/download/${TAG}|g" assets/install.sh
          tar -czf assets/client.tar.gz -C stage web
          tar -czf assets/host.tar.gz -C stage bins
          (cd assets && sha256sum install.sh client.tar.gz host.tar.gz > assets.sha256)
          if [ -d stage/data ]; then
            cp stage/data/* assets/
            (cd assets && sha256sum wow-data.tar.part-* >> assets.sha256)
          fi
      - name: publish (one moving release, replaced on each run)
        run: |
          {
            echo "Azeroth Survivors — portable bundle, built $(date -u +%Y-%m-%d\ %H:%M\ UTC) from ${GITHUB_SHA}"
            echo
            echo "| asset | what |"
            echo "| --- | --- |"
            echo "| client.tar.gz + install.sh | the browser client and the cross-platform host installer |"
            echo "| host.tar.gz | prebuilt wenilla-host server binaries (linux + windows) |"
            if [ -d stage/data ]; then
              echo "| wow-data.tar.part-* | the WoW 1.12.1 client's Data folder, split below GitHub's 2 GiB per-asset ceiling |"
              echo "| sha256.txt | checksum of the data, as one concatenated stream |"
              echo
              echo "Bundled data is Blizzard game content, hosted by explicit request of the repo owner. **Legal note:** the project itself ships none of it — see the README and archive.org."
            fi
          } > notes.md
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG}" --title "Azeroth Survivors — ${TAG}" --notes-file notes.md --latest assets/*
