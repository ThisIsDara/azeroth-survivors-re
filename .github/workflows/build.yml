# A manual build of the browser client: the same chain as `make build`, handed back as
#
#   - a `web-dist` run artifact (raw web/dist), always
#   - prebuilt wenilla-host binaries (linux), always
#   - an Inno Setup installer for Windows (client + host + data fetcher), always
#   - a GitHub release (tag from the `tag` input) with: the installer, client tarball, host
#     binaries, and — when the `data` input is on — the WoW 1.12.1 client split into
#     <2 GiB chunks, the release-asset ceiling. Runners have the RAM and disk a small
#     local box lacks.
#
# The bundled data is Blizzard content, re-hosted at the repo owner's request; the project
# itself ships none and points at archive.org instead.
name: build

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Rendering backend
        type: choice
        options: [webgpu, webgl2]
        default: webgpu
      debug:
        description: Keep wasm symbols (WEB_DEBUG=1) for readable stack traces
        type: boolean
        default: false
      data:
        description: Download and bundle the WoW 1.12.1 client data (~5.5 GB, +15 min)
        type: boolean
        default: true
      tag:
        description: Release tag to publish (a re-run replaces it)
        type: string
        default: latest

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # No debuginfo: it is most of target/, and a runner's disk is small.
      CARGO_PROFILE_DEV_DEBUG: 0
      WEB_BACKEND: ${{ inputs.backend }}
      WEB_DEBUG: ${{ inputs.debug && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: brotli (precompressed siblings for the host)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq brotli
      - name: Toolchain
        run: rustup toolchain install && rustc -V
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-wasm
          # wasi-sdk and binaryen land in tools/, wasm-bindgen-cli in ~/.cargo/bin.
          cache-directories: tools
      - name: toolchain (scripts/web-setup.sh)
        run: scripts/web-setup.sh
      - name: build (scripts/web-build.sh)
        run: scripts/web-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 7

  host-bins:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: host-bins
      - name: linux binary
        run: cargo build --release -p wenilla-host --locked
      - name: pack
        run: |
          mkdir -pv out
          cp target/release/wenilla-host out/wenilla-host-linux-x86_64
          gzip -9 out/wenilla-host-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: host-bins
          path: out/
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # A host binary with no runtime dependency on the VC++ redistributables.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-installer
      - name: wenilla-host (MSVC)
        run: cargo build --release -p wenilla-host --locked
      - name: smoke — the exe boots on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force www,Data | Out-Null
          Set-Content -Path www\index.html -Value '<html></html>'
          & 'target\release\wenilla-host.exe' --help 2>&1 | Select-String 'wenilla-host|Usage'
          if ($LASTEXITCODE -ne 0) { throw "--help exit $LASTEXITCODE — the CRT-static exe won't run" }
          # Chain::open scans for MPQs before the listener binds; an empty Data dir proves the
          # startup path runs to the scan by failing there with exactly the expected bail.
          $out = & 'target\release\wenilla-host.exe' --data Data --www www 2>&1 | Out-String
          if ($out -notmatch 'no known vanilla MPQs found') {
            throw "unexpected startup output:`n$out"
          }
          Write-Host "smoke OK — exec runs, startup reaches the MPQ scan"
      - name: fetch-data.ps1 parse check
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw release\fetch-data.ps1))
          Write-Host "fetch-data.ps1 parses"
      - name: bake the release base into fetch-data.bat
        shell: pwsh
        run: |
          $base = "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}"
          $p = 'release\fetch-data.bat'
          (Get-Content -Raw $p).Replace('__ASSET_BASE__', $base) | Set-Content -Encoding Ascii $p
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: stage\www
      - name: compile (ISCC)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $stamp = "{0} {1}" -f (Get-Date -Format 'yyyy-MM-dd'), '${{ github.sha }}'.Substring(0, 7)
          $iss = (Resolve-Path 'release\azeroth-survivors.iss').Path
          $out = (Resolve-Path 'release').Path
          $dAssetBase = "/DAssetBase=https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}"
          $dStamp = "/DBuildStamp=$stamp"
          Remove-Item Env:\RUSTFLAGS -ErrorAction SilentlyContinue
          & $iscc $dAssetBase $dStamp "/O$out" $iss 2>&1 | ForEach-Object { Write-Host $_ }
          Get-ChildItem "$out\setup" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release\setup\*.exe
          if-no-files-found: error
          retention-days: 7

  data:
    if: ${{ inputs.data }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      # The zip, the tar and the chunks coexist briefly: ~16 GB working set.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # One 1.12.1 client is all there ever is; chunks ~5.4 GB persist between dispatches and
      # every run after the first skips the archive.org download, tar and split.
      - uses: actions/cache@v4
        with:
          path: cache/wow-data
          key: wow-data-1.12.1-5875-enUS
      - name: produce the data chunks (or restore the cached ones)
        run: |
          mkdir -pv out cache/wow-data
          if [ -f cache/wow-data/wow-data.tar.part-00 ]; then
            echo "cache hit — reusing the chunked data"
            cp cache/wow-data/* out/
            ls -la out
            exit 0
          fi
          scripts/fetch-data.sh
          tar -cf cache/wow-data/wow-data.tar -C wow-data Data
          (cd cache/wow-data && sha256sum wow-data.tar > sha256.txt)
          split -b 1900M -d cache/wow-data/wow-data.tar cache/wow-data/wow-data.tar.part-
          rm cache/wow-data/wow-data.tar
          cp cache/wow-data/* out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: data-parts
          path: out/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [wasm, host-bins, windows, data]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: stage/web/dist
      - uses: actions/download-artifact@v4
        with:
          name: host-bins
          path: stage/bins
      - if: ${{ inputs.data }}
        uses: actions/download-artifact@v4
        with:
          name: data-parts
          path: stage/data
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: stage/setup
      - name: pack the release assets
        run: |
          mkdir -pv assets
          cp release/install.sh assets/install.sh
          sed -i "s|__ASSET_BASE__|https://github.com/${REPO}/releases/download/${TAG}|g" assets/install.sh
          tar -czf assets/client.tar.gz -C stage web
          tar -czf assets/host.tar.gz -C stage bins
          cp stage/setup/*.exe assets/azeroth-survivors-setup.exe
          (cd assets && sha256sum install.sh client.tar.gz host.tar.gz azeroth-survivors-setup.exe > assets.sha256)
          if [ -d stage/data ]; then
            cp stage/data/* assets/
            (cd assets && sha256sum wow-data.tar.part-* >> assets.sha256)
          fi
      - name: publish (one moving release, replaced on each run)
        run: |
          {
            echo "Azeroth Survivors — portable bundle, built $(date -u +%Y-%m-%d\ %H:%M\ UTC) from ${GITHUB_SHA}"
            echo
            echo "| asset | what |"
            echo "| --- | --- |"
            echo "| azeroth-survivors-setup.exe | **the Windows installer** — client, wenilla-host.exe and launcher; fetches the WoW data into the install's Data folder on first run |"
            echo "| client.tar.gz + install.sh | the browser client and the cross-platform host installer |"
            echo "| host.tar.gz | prebuilt wenilla-host server binaries (linux) |"
            if [ -d stage/data ]; then
              echo "| wow-data.tar.part-* | the WoW 1.12.1 client's Data folder, split below GitHub's 2 GiB per-asset ceiling |"
              echo "| sha256.txt | checksum of the data, as one concatenated stream |"
              echo
              echo "Bundled data is Blizzard game content, hosted by explicit request of the repo owner. **Legal note:** the project itself ships none of it — see the README and archive.org."
            fi
          } > notes.md
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG}" --title "Azeroth Survivors — ${TAG}" --notes-file notes.md --latest assets/*
